name: NotchFlow Native Build

on:
  push:
    branches:
      - fresh/reminders-liquid-glass

permissions:
  contents: read

concurrency:
  group: notchflow-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  foundation-policy:
    name: Date parsing and clipboard policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run deterministic date parser checks
        run: |
          swiftc -swift-version 5 -parse-as-library DynamicIsland/helpers/ReminderDateParser.swift tests/ReminderDateParserRegression.swift -o /tmp/reminder-date-tests
          /tmp/reminder-date-tests
      - name: Compile and run clipboard policy checks
        run: |
          swiftc -swift-version 5 -parse-as-library DynamicIsland/helpers/CompactClipboardPolicy.swift tests/CompactClipboardRegression.swift -o /tmp/clipboard-policy-tests
          /tmp/clipboard-policy-tests

  build:
    name: macOS — ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            os: macos-15-intel
          - configuration: Release
            os: macos-26

    steps:
      - name: Checkout source and upstream artwork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          xcode_major=$(xcodebuild -version | awk '/^Xcode / { split($2, parts, "."); print parts[1] }')
          if [ "$xcode_major" -lt 26 ]; then
            echo "::error::Xcode 26 or newer is required to compile the native Liquid Glass implementation."
            exit 1
          fi
          echo "cache-key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned Swift packages
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: .build-ci/SourcePackages
          key: ${{ runner.os }}-notchflow-swiftpm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('DynamicIsland.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Validate privacy configuration
        run: python3 -m unittest tests.test_privacy_configuration

      - name: Check reminder date parsing
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -parse-as-library \
            DynamicIsland/helpers/ReminderDateParser.swift \
            tests/ReminderDateParserRegression.swift -o "$RUNNER_TEMP/ReminderDateParserRegression"
          "$RUNNER_TEMP/ReminderDateParserRegression"

      - name: Check compact clipboard policy
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -parse-as-library \
            DynamicIsland/helpers/CompactClipboardPolicy.swift \
            tests/CompactClipboardRegression.swift -o "$RUNNER_TEMP/CompactClipboardRegression"
          "$RUNNER_TEMP/CompactClipboardRegression"

      - name: Check Reminders with fake service
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -parse-as-library \
            DynamicIsland/models/ReminderItem.swift \
            DynamicIsland/Providers/RemindersServiceProviding.swift \
            DynamicIsland/managers/RemindersManager.swift \
            tests/RemindersRegression.swift -o "$RUNNER_TEMP/RemindersRegression"
          "$RUNNER_TEMP/RemindersRegression"

      - name: Prepare Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcodebuild -runFirstLaunch
          if xcrun -f metal >/dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain && xcrun -f metal >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Metal toolchain is unavailable after five download attempts."
          exit 1

      - name: Resolve recorded dependencies
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-ci
          xcodebuild -resolvePackageDependencies \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -clonedSourcePackagesDirPath .build-ci/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee .build-ci/package-resolution.log
          git diff --exit-code -- DynamicIsland.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Compile native app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration '${{ matrix.configuration }}' \
            -destination 'platform=macOS' \
            -derivedDataPath .build-ci/DerivedData \
            -clonedSourcePackagesDirPath .build-ci/SourcePackages \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath '.build-ci/BuildResults-${{ matrix.configuration }}.xcresult' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            2>&1 | tee '.build-ci/build-${{ matrix.configuration }}.log'

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          if [ -f '.build-ci/build-${{ matrix.configuration }}.log' ]; then
            grep -n -B 3 -A 6 'error:' '.build-ci/build-${{ matrix.configuration }}.log' | head -160 || true
          fi

      - name: Save resolved packages even if compilation fails
        if: always() && steps.resolve.outcome == 'success' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-ci/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.configuration }}
          path: |
            .build-ci/*.log
            .build-ci/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
