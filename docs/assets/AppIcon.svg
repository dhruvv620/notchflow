<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d3a"/>
      <stop offset="1" stop-color="#0c0d14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fa9e6b"/>
      <stop offset="0.27" stop-color="#fa739e"/>
      <stop offset="0.52" stop-color="#b37afa"/>
      <stop offset="0.77" stop-color="#66a8ff"/>
      <stop offset="1" stop-color="#61dbcc"/>
    </linearGradient>
    <linearGradient id="flowv" gradientUnits="userSpaceOnUse" x1="512" y1="236" x2="660" y2="830">
      <stop offset="0" stop-color="#fa9e6b"/>
      <stop offset="0.28" stop-color="#fa739e"/>
      <stop offset="0.55" stop-color="#b37afa"/>
      <stop offset="0.8" stop-color="#66a8ff"/>
      <stop offset="1" stop-color="#61dbcc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- the notch -->
    <path d="M 332 100 L 692 100 L 692 168 Q 692 236 624 236 L 400 236 Q 332 236 332 168 Z" fill="#000"/>
    <!-- the flow, pouring out of the notch -->
    <path d="M 512 236 C 512 372, 296 384, 300 520 C 304 656, 724 592, 724 732 C 724 790, 690 818, 648 830" fill="none" stroke="url(#flowv)" stroke-width="80" stroke-linecap="round" filter="url(#soft)" opacity="0.65"/>
    <path d="M 512 236 C 512 372, 296 384, 300 520 C 304 656, 724 592, 724 732 C 724 790, 690 818, 648 830" fill="none" stroke="url(#flowv)" stroke-width="60" stroke-linecap="round"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

</svg>
